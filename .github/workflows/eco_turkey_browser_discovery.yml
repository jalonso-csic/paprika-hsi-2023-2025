name: ECO Turkey browser discovery

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/eco_turkey_browser_discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Discover official crop dataflow and routes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eco_temp_turkey_browser
          mkdir -p eco_temp_turkey_browser
          cat > /tmp/discover_browser.py <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json, re, hashlib, time

          OUT = Path('eco_temp_turkey_browser')
          results = {'bulk': {}, 'press': {}, 'network': [], 'downloads': [], 'errors': []}

          def compact(s, n=12000):
              return re.sub(r'\s+', ' ', s or '').strip()[:n]

          def record_response(resp):
              url = resp.url
              ct = (resp.headers.get('content-type') or '').lower()
              if any(k in url.lower() for k in ['bulk', 'sdmx', 'dataflow', 'databrowser', 'download', '/api/']) or any(k in ct for k in ['json', 'xml', 'csv']):
                  item = {'url': url, 'status': resp.status, 'content_type': ct}
                  try:
                      clen = int(resp.headers.get('content-length', '0') or 0)
                      if any(k in ct for k in ['json', 'xml', 'text']) and clen < 5000000:
                          item['body_excerpt'] = compact(resp.text(), 20000)
                  except Exception as exc:
                      item['body_error'] = repr(exc)
                  results['network'].append(item)

          def save_download(download):
              name = re.sub(r'[^A-Za-z0-9._-]+', '_', download.suggested_filename)
              path = OUT / f'download_{name}'
              download.save_as(str(path))
              data = path.read_bytes()
              results['downloads'].append({
                  'suggested_filename': download.suggested_filename,
                  'path': str(path),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'url': download.url,
              })

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  locale='tr-TR', accept_downloads=True,
                  viewport={'width': 1600, 'height': 1100},
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'
              )
              page = context.new_page()
              page.on('response', record_response)
              page.on('download', save_download)

              try:
                  page.goto('https://veriportali.tuik.gov.tr/tr/bulk-download', wait_until='networkidle', timeout=120000)
                  page.wait_for_timeout(6000)
                  results['bulk']['url'] = page.url
                  results['bulk']['title'] = page.title()
                  results['bulk']['body_excerpt'] = compact(page.locator('body').inner_text(), 40000)
                  results['bulk']['buttons'] = page.locator('button').all_inner_texts()
                  results['bulk']['links'] = page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim(), href:a.href}))")
                  page.screenshot(path=str(OUT/'bulk_initial.png'), full_page=True)

                  for i in range(page.locator('input').count()):
                      inp = page.locator('input').nth(i)
                      try:
                          typ = inp.get_attribute('type')
                          if typ in (None, 'text', 'search'):
                              inp.fill('Bitkisel Üretim')
                              page.wait_for_timeout(3000)
                              body = page.locator('body').inner_text()
                              if 'Bitkisel' in body or 'Meyve' in body:
                                  results['bulk']['search_input_index'] = i
                                  results['bulk']['after_search_excerpt'] = compact(body, 40000)
                                  page.screenshot(path=str(OUT/'bulk_after_search.png'), full_page=True)
                                  break
                              inp.fill('')
                      except Exception as exc:
                          results['errors'].append({'search_input': i, 'error': repr(exc)})

                  matches = page.get_by_text(re.compile('Bitkisel|Meyve|Crop Production|Fruit', re.I))
                  results['bulk']['relevant_count'] = matches.count()
                  containers = []
                  for i in range(min(matches.count(), 20)):
                      try:
                          loc = matches.nth(i)
                          container = loc.locator('xpath=ancestor::*[self::tr or self::div][1]')
                          containers.append({
                              'text': compact(container.inner_text(), 4000),
                              'buttons': container.locator('button').all_inner_texts(),
                              'links': container.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim(), href:a.href}))")
                          })
                      except Exception as exc:
                          results['errors'].append({'candidate': i, 'error': repr(exc)})
                  results['bulk']['candidate_containers'] = containers
              except Exception as exc:
                  results['errors'].append({'bulk_page': repr(exc)})

              try:
                  page.goto('https://veriportali.tuik.gov.tr/tr/press/53447', wait_until='networkidle', timeout=120000)
                  page.wait_for_timeout(6000)
                  results['press']['url'] = page.url
                  results['press']['title'] = page.title()
                  results['press']['body_excerpt'] = compact(page.locator('body').inner_text(), 40000)
                  results['press']['buttons'] = page.locator('button').all_inner_texts()
                  results['press']['links'] = page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim(), href:a.href}))")
                  page.screenshot(path=str(OUT/'press.png'), full_page=True)

                  matches = page.get_by_text(re.compile('Meyve ürünleri.*baharat|Production of fruits.*spices', re.I))
                  results['press']['fruit_table_matches'] = matches.count()
                  elems = []
                  for i in range(matches.count()):
                      try:
                          loc = matches.nth(i)
                          elems.append({
                              'text': compact(loc.inner_text(), 2000),
                              'tag': loc.evaluate('e => e.tagName'),
                              'outer': compact(loc.evaluate('e => e.outerHTML'), 10000)
                          })
                      except Exception as exc:
                          results['errors'].append({'press_match': i, 'error': repr(exc)})
                  results['press']['fruit_elements'] = elems
              except Exception as exc:
                  results['errors'].append({'press_page': repr(exc)})

              try:
                  results['cookies'] = context.cookies()
                  results['local_storage'] = page.evaluate('Object.fromEntries(Object.entries(localStorage))')
                  results['session_storage'] = page.evaluate('Object.fromEntries(Object.entries(sessionStorage))')
              except Exception as exc:
                  results['errors'].append({'storage': repr(exc)})

              browser.close()

          seen = set()
          deduped = []
          for item in results['network']:
              key = (item.get('url'), item.get('status'), item.get('body_excerpt', '')[:500])
              if key not in seen:
                  seen.add(key)
                  deduped.append(item)
          results['network'] = deduped

          (OUT/'discovery.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT/'run.json').write_text(json.dumps({'run_id': '${{ github.run_id }}', 'sha': '${{ github.sha }}'}, indent=2), encoding='utf-8')
          print(json.dumps({
              'network_count': len(results['network']),
              'download_count': len(results['downloads']),
              'bulk_relevant': results['bulk'].get('relevant_count'),
              'press_matches': results['press'].get('fruit_table_matches'),
              'errors': results['errors']
          }, ensure_ascii=False, indent=2))
          PY
          python /tmp/discover_browser.py

      - name: Commit discovery outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ECO Turkey browser discovery'
          git config user.email 'actions@users.noreply.github.com'
          git add eco_temp_turkey_browser
          git commit -m 'Record ECO Turkey browser discovery' || true
          git push
