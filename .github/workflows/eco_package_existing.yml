name: ECO package downloaded MAPA sources

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/eco_package_existing.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record workflow run
        run: |
          printf '{"run_id": "%s", "repository": "%s", "sha": "%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > eco_mapa_sources/run_info.json
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ECO_MAPA_sources_2015_2022
          path: eco_mapa_sources
          if-no-files-found: error
          retention-days: 2
      - name: Commit run identifier
        run: |
          git config user.name 'ECO source archiver'
          git config user.email 'actions@users.noreply.github.com'
          git add eco_mapa_sources/run_info.json
          git commit -m 'Record temporary ECO source package run' || exit 0
          git push
