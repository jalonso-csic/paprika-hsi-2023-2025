name: Remove temporary ECO MAPA bridge

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/eco_cleanup.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary ECO files and workflows
        run: |
          rm -rf eco_mapa_sources
          rm -f .github/workflows/eco_fetch_mapa_sources.yml
          rm -f .github/workflows/eco_package_existing.yml
          rm -f .github/workflows/eco_cleanup.yml
          git config user.name 'ECO source archiver'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary ECO MAPA download bridge'
          git push
