name: ECO Turkey portal API extraction

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/eco_turkey_portal_api.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Record run
        shell: bash
        run: |
          mkdir -p eco_temp_turkey_api
          printf '{"run_id":"%s","sha":"%s"}\n' '${{ github.run_id }}' '${{ github.sha }}' > eco_temp_turkey_api/run.json

      - name: Query portal catalog with session cookies
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, json, re, hashlib, traceback
          from pathlib import Path

          OUT=Path('eco_temp_turkey_api')
          base='https://veriportali.tuik.gov.tr'
          lang='tr'
          page_url=f'{base}/{lang}/statistical-themes'
          api_url=f'{base}/api/{lang}/data/statistical-themes'
          headers={
            'Accept':'application/json, text/plain, */*',
            'Accept-Language':'tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7',
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122 Safari/537.36'
          }
          s=requests.Session()
          result={'landing':{},'api':{},'candidates':[],'sdmx_attempts':[]}
          try:
            r=s.get(page_url,headers=headers,timeout=45)
            result['landing']={'status':r.status_code,'bytes':len(r.content),'url':r.url,'cookies':s.cookies.get_dict()}
            r.raise_for_status()
            h=dict(headers); h.update({'Referer':page_url,'Origin':base,'X-Requested-With':'XMLHttpRequest'})
            a=s.get(api_url,headers=h,timeout=45)
            result['api']={'status':a.status_code,'bytes':len(a.content),'url':a.url,'content_type':a.headers.get('content-type')}
            a.raise_for_status()
            obj=a.json()
            (OUT/'theme_tree.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
            data=obj.get('data',obj)
            themes=data if isinstance(data,list) else data.get('data',data) if isinstance(data,dict) else []
            ag=None
            for n in themes:
              if str(n.get('id'))=='13' or str(n.get('name','')).lower() in ('tarım','agriculture'):
                ag=n; break
            if ag is None:
              ag={'children':themes}

            pat=re.compile(r'kiraz|vişne|visne|meyve|fruit|bitkisel üretim|crop production|bahçe|bahce|orchard',re.I)
            def walk(node,path=()):
              if isinstance(node,dict):
                name=str(node.get('name') or node.get('title') or node.get('text') or '')
                icon=str(node.get('icon') or node.get('type') or '')
                url=str(node.get('url') or node.get('href') or node.get('link') or node.get('path') or '')
                blob=' '.join(str(v) for k,v in node.items() if k not in ('children',) and isinstance(v,(str,int,float)))
                if pat.search(blob):
                  result['candidates'].append({'path':' > '.join(path+(name,)),'name':name,'icon':icon,'url':url,'node':node})
                for c in node.get('children') or []:
                  walk(c,path+(name,))
              elif isinstance(node,list):
                for c in node: walk(c,path)
            walk(ag)
            (OUT/'candidates.json').write_text(json.dumps(result['candidates'],ensure_ascii=False,indent=2),encoding='utf-8')

            ids=[]
            for c in result['candidates']:
              texts=[c.get('url',''),json.dumps(c.get('node',{}),ensure_ascii=False)]
              for text in texts:
                for m in re.findall(r'(TR,DF_[A-Za-z0-9_]+,[0-9.]+)',text):
                  if m not in ids: ids.append(m)
                m=re.search(r'dataflow/([^/]+)/([^/]+)/([^/?#]+)',text)
                if m:
                  x=','.join(m.groups())
                  if x not in ids: ids.append(x)
            result['dataflow_ids']=ids
            for did in ids:
              u=f'https://nsiws.tuik.gov.tr/rest/data/{did}/ALL/?detail=full&dimensionAtObservation=TIME_PERIOD&startPeriod=2024&endPeriod=2024'
              att={'dataflow_id':did,'url':u}
              try:
                q=s.get(u,headers={'User-Agent':headers['User-Agent'],'Accept':'application/vnd.sdmx.genericdata+xml;version=2.1, application/xml;q=0.9,*/*;q=0.8','Referer':page_url},timeout=60)
                att.update({'status':q.status_code,'bytes':len(q.content),'content_type':q.headers.get('content-type')})
                if q.status_code==200 and q.content:
                  fn=re.sub(r'[^A-Za-z0-9_-]+','_',did)+'_2024.xml'
                  (OUT/fn).write_bytes(q.content)
                  txt=q.content.decode('utf-8','ignore')
                  att['contains_cherry_terms']=bool(re.search(r'kiraz|vişne|visne|cherry',txt,re.I))
                  att['sha256']=hashlib.sha256(q.content).hexdigest()
              except Exception as e:
                att['error']=repr(e)
              result['sdmx_attempts'].append(att)
          except Exception as e:
            result['fatal_error']=repr(e)
            result['traceback']=traceback.format_exc()
          (OUT/'status.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2)[:30000])
          PY

      - name: Commit results
        if: always()
        shell: bash
        run: |
          git config user.name 'ECO Turkey portal API'
          git config user.email 'actions@users.noreply.github.com'
          git add eco_temp_turkey_api
          git commit -m 'Record ECO Turkey portal API results' || true
          git pull --rebase || true
          git push
